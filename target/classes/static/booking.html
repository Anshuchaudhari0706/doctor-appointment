<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="style.css">
<script src="session.js"></script>
</head>
<body onload="checkSession()">
<div class="container">
<input id="disease" placeholder="Disease">
<input id="date" type="date">
<select id="doc"><option>Dr Mehta</option></select>
<select id="slot"><option>10-11</option></select>
<select id="pay"><option>Cash</option></select>
<button onclick="book()">Book</button>
</div>

<script>
function book(){
fetch("http://localhost:8080/api/booking",{
 method:"POST",
 headers:{'Content-Type':'application/json'},
 body:JSON.stringify({
   username:localStorage.getItem("loginUser"),
   disease:disease.value,
   bookingDate:date.value,
   doctorName:doc.value,
   slot:slot.value,
   paymentMethod:pay.value
 })
}).then(()=>location="mybookings.html");
}
</script>
</body>
</html>
